services:
  cron:
    build:
      context: .
      dockerfile: Dockerfile-cron
    volumes:
      - .:/var/www/html
    entrypoint: [ "/bin/sh", "-c", "while :; do php artisan schedule:run >> /dev/null 2>&1; sleep 60; done" ]
    networks:
      - app-network
    depends_on:
      - db-iseta

  db-iseta:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: movedb
      MYSQL_USER: user
      MYSQL_PASSWORD: user
    ports:
      - "8016:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network

  phpmyadmin-iseta:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db-iseta
      PMA_USER: root
      PMA_PASSWORD: root
      UPLOAD_LIMIT: 300M
    ports:
      - "8081:80"
    depends_on:
      - db-iseta
    networks:
      - app-network

volumes:
  db_data:


networks:
  app-network:
